name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch|minor|major && git push --follow-tags
#
# Publishing from CI rather than a laptop earns the package a provenance
# attestation: npm records which workflow, commit and repo produced the tarball,
# and shows a verified badge on the package page. Requires an npm automation
# token in the NPM_TOKEN repository secret.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
