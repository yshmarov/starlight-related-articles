name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  demo:
    name: Build demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install
        working-directory: demo
      - run: npm run build
        working-directory: demo
      # The plugin renders nothing when it fails to resolve, so assert the
      # section actually made it into the output rather than trusting exit 0.
      - name: Assert the section rendered
        working-directory: demo
        run: |
          grep -q 'class="sl-related' dist/guides/domains/connecting-a-domain/index.html
          grep -q 'Connecting a subdomain' dist/guides/domains/connecting-a-domain/index.html
          echo "related-articles section present"
